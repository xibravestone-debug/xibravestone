    <style>

        /* Layout Dasar Navigasi (Desktop) */
header nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
}

.nav-links {
    display: flex;
    list-style: none;
    align-items: center;
    gap: 20px;
    margin: 0;
    padding: 0;
}

.nav-links li a {
    text-decoration: none;
    color: #fff; /* Sesuaikan warna teks Anda */
}

/* Tombol Hamburger Default Disembunyikan di Desktop */
.hamburger {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 21px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
}

.hamburger span {
    height: 3px;
    width: 100%;
    background-color: #fff; /* Warna garis hamburger */
    border-radius: 3px;
    transition: all 0.3s ease;
}

/* Style khusus Layar HP (Maksimal Lebar 768px) */
@media screen and (max-width: 768px) {
    .hamburger {
        display: flex; /* Tampilkan tombol hamburger */
    }

    .nav-links {
        display: none; /* Sembunyikan menu desktop */
        flex-direction: column;
        width: 100%;
        position: absolute;
        top: 100%;
        left: 0;
        background: rgba(0, 0, 0, 0.9); /* Sesuai gaya 'glass' Anda */
        backdrop-filter: blur(10px);
        padding: 20px 0;
        gap: 15px;
    }

    /* Klas untuk menampilkan menu saat hamburger diklik */
    .nav-links.active {
        display: flex;
    }
}

    .btn-video {
    background: linear-gradient(135deg, #ff007f, #7928ca);
    color: #ffffff;
    border: none;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
    transition: all 0.3s ease;
    animation: pulse 2s infinite;
}

.btn-video:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 0 22px rgba(255, 0, 127, 0.8);
    background: linear-gradient(135deg, #7928ca, #ff007f);
}

/* Animasi Denyut */
@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.6);
    }
    70% {
        box-shadow: 0 0 0 12px rgba(255, 0, 127, 0);
    }
    100% {
        box-shadow: 0 0 0 0 rgba(255, 0, 127, 0);
    }
}

    .btn-video {
    transition: transform 0.2s ease;
}

.btn-video:hover {
    transform: translateY(-3px) scale(1.05);
}
       
    </style>
</head>
